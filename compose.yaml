services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sarzedo
      MYSQL_USER: sarzedo
      MYSQL_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  app:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
      DB_DRIVER: mysql
      DB_HOST: db
      DB_DATABASE: sarzedo
      DB_USERNAME: sarzedo
    volumes:
      - uploads:/var/www/public/uploads
      - runtime:/var/www/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  web:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/public:ro
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/var/www/public/uploads:ro
    depends_on:
      - app
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
      DB_DRIVER: mysql
      DB_HOST: db
      DB_DATABASE: sarzedo
      DB_USERNAME: sarzedo
    command: ["sh", "-c", "while true; do php scripts/worker.php; sleep 300; done"]
    volumes:
      - runtime:/var/www/storage
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    restart: unless-stopped
volumes:
  mysql_data:
  uploads:
  runtime:
